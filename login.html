<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stomatologiya | Kirish</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page-bg" style="background-image: url('bg.png');">

    <div class="minimal-login-container">
        <div style="display: flex; justify-content: center; margin-bottom: 14px;">
            <div class="lang-switch-group">
                <button type="button" class="btn-lang active" data-lang="uz" id="btnLoginLangUz">🇺🇿 O'zbekcha</button>
                <button type="button" class="btn-lang" data-lang="ru" id="btnLoginLangRu">🇷🇺 Русский</button>
            </div>
        </div>
        <form id="loginForm" class="minimal-login-form">
            <div id="loginAlert" class="minimal-alert d-none"></div>

            <div class="form-field">
                <input type="text" id="username" placeholder="Login" required autocomplete="off">
            </div>

            <div class="form-field">
                <input type="password" id="password" placeholder="Parol" required autocomplete="off">
            </div>

            <button type="submit" id="loginBtn" class="btn-minimal-submit">Kirish</button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
